<!doctype html>
<!-- source of media/banner.png: node tools/logo.js renders it with Edge (transparent background) -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.b{width:600px;height:160px;display:flex;align-items:center;gap:26px;padding-left:8px;box-sizing:border-box}
.medal{position:relative;width:144px;height:144px;flex:none}
.medal svg{position:absolute;inset:0}
.medal img{position:absolute;left:24px;top:24px;width:96px;height:96px;border-radius:50%;object-fit:cover}
.word{font-family:Cinzel,serif;color:#ecd6a8;line-height:1}
.big{font-size:74px;font-weight:500;letter-spacing:.12em;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.small{font-size:24px;font-weight:600;letter-spacing:1.05em;margin-bottom:10px;padding-left:.2em;text-shadow:0 1px 4px rgba(0,0,0,.6)}
</style></head><body>
<div class="b">
 <div class="medal">
  <svg viewBox="0 0 144 144" width="144" height="144">
   <defs>
    <linearGradient id="br" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9c98f"/><stop offset=".35" stop-color="#9a6a33"/><stop offset=".6" stop-color="#d6ab6c"/><stop offset="1" stop-color="#5a3a17"/></linearGradient>
    <radialGradient id="in" cx="50%" cy="50%" r="50%"><stop offset=".8" stop-color="#1a0f05"/><stop offset="1" stop-color="#4a3015"/></radialGradient>
   </defs>
   <!-- four points like a compass -->
   <g fill="url(#br)" stroke="#2a1806" stroke-width="1">
    <path d="M72 0 L80 14 L64 14 Z"/><path d="M72 144 L64 130 L80 130 Z"/><path d="M0 72 L14 64 L14 80 Z"/><path d="M144 72 L130 80 L130 64 Z"/>
   </g>
   <circle cx="72" cy="72" r="60" fill="url(#br)" stroke="#2a1806" stroke-width="1.5"/>
   <circle cx="72" cy="72" r="51" fill="url(#in)" stroke="#2a1806" stroke-width="1.5"/>
   <g fill="#f3dfb4" opacity=".9" id="rivets"></g>
  </svg>
  <img src="logo-400.png" alt="">
 </div>
 <div class="word"><div class="small">FOREVER</div><div class="big">CLEANSE</div></div>
</div>
<script>
// rivets around the ring
const g = document.getElementById('rivets');
for (let i = 0; i < 24; i++) {
  const a = i / 24 * Math.PI * 2, r = 55.5;
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', 72 + Math.cos(a) * r); c.setAttribute('cy', 72 + Math.sin(a) * r); c.setAttribute('r', 1.4);
  g.appendChild(c);
}
</script>
</body></html>
