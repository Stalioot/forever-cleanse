<!doctype html>
<!-- source of media/banner.png: node tools/logo.js renders it with Edge -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.b{position:relative;width:600px;height:160px;border-radius:10px;overflow:hidden;display:flex;align-items:center;gap:22px;padding-left:6px;box-sizing:border-box;
  background:radial-gradient(ellipse 60% 120% at 14% 50%, #2a0b45 0%, #12051e 45%, #07030b 100%)}
.b>svg.fog{position:absolute;inset:0}
.medal{position:relative;width:156px;height:156px;flex:none}
.medal svg{position:absolute;inset:0}
.medal img{position:absolute;left:36px;top:36px;width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #12051e, 0 0 14px 4px rgba(160,60,255,.55)}
.word{position:relative;font-family:Cinzel,serif;color:#ddd0ec;line-height:1;text-shadow:0 0 12px rgba(150,60,255,.55), 0 2px 4px #000}
.small{font-size:22px;font-weight:600;letter-spacing:1.1em;padding-left:.15em;margin-bottom:10px;color:#a98fc9}
.big{font-size:70px;font-weight:500;letter-spacing:.11em}
</style></head><body>
<div class="b">
 <svg class="fog" viewBox="0 0 600 160" preserveAspectRatio="none">
  <defs>
   <filter id="fog" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="4" seed="9"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .15  0 0 0 0 .75  1.2 0 0 0 -.62"/></filter>
   <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
  </defs>
  <rect width="600" height="160" filter="url(#fog)" opacity=".55"/>
  <rect width="600" height="160" fill="url(#vig)"/>
 </svg>
 <div class="medal">
  <svg viewBox="0 0 156 156" width="156" height="156">
   <defs>
    <filter id="burn" x="-30%" y="-30%" width="160%" height="160%">
     <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4" result="n"/>
     <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <radialGradient id="fl" cx="50%" cy="50%" r="50%"><stop offset=".5" stop-color="#fff0ff"/><stop offset=".6" stop-color="#e08bff"/><stop offset=".75" stop-color="#8f2be0"/><stop offset="1" stop-color="#3a0a66" stop-opacity="0"/></radialGradient>
    <radialGradient id="fl2" cx="50%" cy="50%" r="50%"><stop offset=".5" stop-color="#b34dff"/><stop offset="1" stop-color="#2a0548" stop-opacity="0"/></radialGradient>
   </defs>
   <g id="halo" filter="url(#soft)" opacity=".9"></g>
   <g id="flames" filter="url(#burn)"></g>
   <circle cx="78" cy="78" r="44" fill="#0b0312"/>
  </svg>
  <img src="logo-400.png" alt="">
 </div>
 <div class="word"><div class="small">FOREVER</div><div class="big">CLEANSE</div></div>
</div>
<script>
// a crown of demonic flame tongues around the medallion: three layers, outer dark to inner bright
const NS = 'http://www.w3.org/2000/svg', C = 78;
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function crown(group, n, r0, len, fill, jitter) {
  for (let i = 0; i < n; i++) {
    const a = (i + rnd() * .4) / n * Math.PI * 2, w = Math.PI * 2 / n * .9;
    const L = len * (.7 + rnd() * .5), bend = 1.6 + rnd() * .8; // tip leans along the rim, clockwise
    const p = (ang, r) => [C + Math.cos(ang) * r, C + Math.sin(ang) * r];
    const [x1, y1] = p(a - w / 2, r0), [x2, y2] = p(a + w / 2, r0);
    const [tx, ty] = p(a + bend * w, r0 + L), [c1x, c1y] = p(a + w * .5, r0 + L * .8), [c2x, c2y] = p(a + w * .9, r0 + L * .35);
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', `M${x1} ${y1} Q${c1x} ${c1y} ${tx} ${ty} Q${c2x} ${c2y} ${x2} ${y2} Z`);
    path.setAttribute('fill', fill); path.setAttribute('opacity', jitter ? .75 + rnd() * .25 : 1);
    group.appendChild(path);
  }
}
const halo = document.getElementById('halo'), flames = document.getElementById('flames');
const disc = (g, r, fill) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', C); c.setAttribute('cy', C); c.setAttribute('r', r); c.setAttribute('fill', fill); g.appendChild(c); };
disc(halo, 60, 'url(#fl2)');
crown(flames, 18, 41, 17, '#4a0e8f', true);
crown(flames, 22, 42, 12, '#9b34f5', true);
crown(flames, 26, 43, 7, '#efb3ff', true);
disc(flames, 46, '#c46bff');
</script>
</body></html>
